
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinConvert - Conversor de Moedas</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <header>
            <div class="icone">↔</div>
            <h1>CoinConvert</h1>
            <p>Converta moedas de forma simples e rápida.</p>
        </header>

        <form id="formulario">
            <label for="valor">Valor</label>
            <input
                type="number"
                id="valor"
                placeholder="Digite um valor"
                min="0"
                step="any"
            >

            <label for="origem">De</label>
            <select id="origem">
                <option value="BRL">Real brasileiro (BRL)</option>
                <option value="USD">Dólar americano (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="GBP">Libra esterlina (GBP)</option>
            </select>

            <button type="button" id="inverter">
                ⇅ Inverter moedas
            </button>

            <label for="destino">Para</label>
            <select id="destino">
                <option value="USD">Dólar americano (USD)</option>
                <option value="BRL">Real brasileiro (BRL)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="GBP">Libra esterlina (GBP)</option>
            </select>

            <button type="submit" id="converter">
                Converter
            </button>
        </form>

        <div id="mensagem" role="alert"></div>

        <section id="resultado" aria-live="polite" hidden>
            <p>Resultado da conversão</p>
            <h2 id="valorConvertido"></h2>
            <p id="detalhes"></p>
            <small id="dataCotacao"></small>
        </section>

        <footer>
            Cotações de referência sujeitas a variações.
        </footer>
    </main>

</body>
</html>
